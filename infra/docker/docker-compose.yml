services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      API_SERVER_BASE_URL: http://api:8080
      MINIO_PUBLIC_PROXY_TARGET: http://minio:9000/lenjoy-bbs
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lenjoy-net

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-5}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://lenjoy:lenjoy@postgres:5432/lenjoy_bbs
      DB_URL: jdbc:postgresql://postgres:5432/lenjoy_bbs
      DB_USER: lenjoy
      DB_PASSWORD: lenjoy
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: lenjoy-bbs
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-/lenjoy-bbs}
    ports:
      - "${API_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - lenjoy-net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lenjoy
      POSTGRES_PASSWORD: lenjoy
      POSTGRES_DB: lenjoy_bbs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lenjoy-net

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - lenjoy-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - lenjoy-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/lenjoy-bbs &&
      mc anonymous set download local/lenjoy-bbs
      "
    networks:
      - lenjoy-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - lenjoy-net

networks:
  lenjoy-net:

volumes:
  postgres-data:
  minio-data:
