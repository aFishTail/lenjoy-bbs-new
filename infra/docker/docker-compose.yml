x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      API_SERVER_BASE_URL: http://api:8080
      MINIO_PUBLIC_PROXY_TARGET: http://minio:9000/lenjoy-bbs
      AUTOMATION_SERVICE_BASE_URL: http://automation-service:8010
      TRANSFER_SERVICE_BASE_URL: http://transfer-service:8008
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
      automation-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
    networks:
      - lenjoy-net

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-5}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-lenjoy}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-lenjoy_bbs}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-lenjoy_bbs}
      DB_USER: ${DB_USER:-lenjoy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-lenjoy-bbs}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-/lenjoy-bbs}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - lenjoy-net

  automation-service:
    build:
      context: ../../../automation-service
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-5}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      TRANSFER_SERVICE_BASE_URL: http://transfer-service:8008
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      AUTOMATION_CALLBACK_BASE_URL: http://automation-service:8010
      TRANSFER_CALLBACK_TOKEN: ${TRANSFER_CALLBACK_TOKEN:?TRANSFER_CALLBACK_TOKEN is required}
      DEFAULT_TRANSFER_TARGET_PATH: ${DEFAULT_TRANSFER_TARGET_PATH:-resource-transfer}
      TRANSFER_SOURCE_PLATFORM: quark
      FORUM_POST_URL: http://api:8080/api/v1/open/posts
      FORUM_API_KEY: ${FORUM_API_KEY:?FORUM_API_KEY is required}
      TASK_STORE_DATABASE_URL: postgresql://${DB_USER:-lenjoy}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-lenjoy_bbs}
      TASK_STORE_SCHEMA: automation
      CORS_ALLOWED_ORIGINS: ""
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
    networks:
      - lenjoy-net

  transfer-service:
    build:
      context: ../../../transfer-service
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-5}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      QUARK_COOKIE_FILE: /run/secrets/quark_cookie
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      TASK_STORE_DATABASE_URL: postgresql://${DB_USER:-lenjoy}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-lenjoy_bbs}
      TASK_STORE_SCHEMA: transfer
      CORS_ALLOWED_ORIGINS: ""
      WORKER_COUNT: ${TRANSFER_WORKER_COUNT:-1}
      TASK_LEASE_SECONDS: ${TRANSFER_TASK_LEASE_SECONDS:-300}
      WORKER_POLL_INTERVAL_SECONDS: ${TRANSFER_WORKER_POLL_INTERVAL_SECONDS:-1}
      WEBHOOK_MAX_ATTEMPTS: ${TRANSFER_WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_RETRY_BASE_SECONDS: ${TRANSFER_WEBHOOK_RETRY_BASE_SECONDS:-5}
    restart: unless-stopped
    logging: *default-logging
    secrets:
      - quark_cookie
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/v1/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - lenjoy-net
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-lenjoy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-lenjoy_bbs}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lenjoy} -d ${DB_NAME:-lenjoy_bbs}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - lenjoy-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - lenjoy-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - lenjoy-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-lenjoy-bbs} &&
      mc anonymous set download local/${MINIO_BUCKET:-lenjoy-bbs}
      "
    networks:
      - lenjoy-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - lenjoy-net

networks:
  lenjoy-net:

volumes:
  postgres-data:
  minio-data:

secrets:
  quark_cookie:
    file: ../../../transfer-service/config/cookies.txt
