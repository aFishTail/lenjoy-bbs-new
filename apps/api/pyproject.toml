[project]
name = "lenjoy-bbs-api"
version = "0.1.0"
description = "Lenjoy BBS API rewritten with FastAPI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "sqlalchemy>=2.0.44",
  "psycopg[binary]>=3.2.12",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.1",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<5",
  "python-multipart>=0.0.20",
  "alembic>=1.17.0",
  "redis>=6.4.0",
  "minio>=7.2.20",
  "pillow>=12.0.0",
  "email-validator>=2.3.0",
  "aiosqlite>=0.22.1",
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
